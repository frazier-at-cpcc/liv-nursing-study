<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUR 213 Exam 1 - Interactive Study Quiz</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .progress-container {
            background: #e9ecef;
            border-radius: 10px;
            height: 12px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, #667eea, #764ba2);
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stat {
            background: #f8f9fa;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .stat-value {
            font-weight: bold;
            color: #667eea;
        }

        .category-badge {
            display: inline-block;
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #333;
            margin-bottom: 25px;
        }

        .select-instruction {
            font-size: 0.85rem;
            color: #666;
            font-style: italic;
            margin-bottom: 15px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            display: flex;
            align-items: flex-start;
            padding: 15px 20px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: white;
        }

        .option:hover:not(.disabled) {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .option.selected {
            border-color: #667eea;
            background: #f0f3ff;
        }

        .option.correct {
            border-color: #28a745;
            background: #d4edda;
        }

        .option.incorrect {
            border-color: #dc3545;
            background: #f8d7da;
        }

        .option.disabled {
            cursor: default;
        }

        .option-letter {
            font-weight: bold;
            margin-right: 12px;
            color: #667eea;
            min-width: 25px;
        }

        .option-text {
            flex: 1;
            line-height: 1.4;
        }

        .option-icon {
            margin-left: 10px;
            font-size: 1.2rem;
        }

        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            display: none;
        }

        .feedback.correct {
            background: #d4edda;
            border: 1px solid #c3e6cb;
        }

        .feedback.incorrect {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
        }

        .feedback-title {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .feedback.correct .feedback-title {
            color: #155724;
        }

        .feedback.incorrect .feedback-title {
            color: #721c24;
        }

        .feedback-text {
            color: #333;
            line-height: 1.5;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-container {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .menu-card {
            text-align: center;
        }

        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 30px 0;
        }

        .menu-btn {
            padding: 20px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .menu-btn:hover {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateY(-2px);
        }

        .menu-btn-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .menu-btn-desc {
            color: #666;
            font-size: 0.9rem;
        }

        .category-select {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .category-option {
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .category-option:hover {
            border-color: #667eea;
        }

        .category-option.selected {
            border-color: #667eea;
            background: #f0f3ff;
        }

        .category-option input {
            margin-right: 10px;
        }

        .results-card {
            text-align: center;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 30px auto;
            color: white;
        }

        .score-percent {
            font-size: 2.5rem;
            font-weight: bold;
        }

        .score-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .results-breakdown {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 30px 0;
            text-align: left;
        }

        .breakdown-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
        }

        .breakdown-label {
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        .breakdown-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #333;
        }

        .review-list {
            text-align: left;
            margin-top: 30px;
        }

        .review-item {
            padding: 15px;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .review-item.correct {
            border-left: 4px solid #28a745;
        }

        .review-item.incorrect {
            border-left: 4px solid #dc3545;
        }

        .review-question {
            font-weight: 500;
            margin-bottom: 8px;
        }

        .review-answer {
            font-size: 0.9rem;
            color: #666;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .card {
                padding: 20px;
            }

            h1 {
                font-size: 1.4rem;
            }

            .stats {
                flex-direction: column;
            }

            .btn-container {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Main Menu -->
        <div id="menu-screen" class="card menu-card">
            <h1>NUR 213 Complex Health Concepts</h1>
            <p class="subtitle">Exam 1 Interactive Study Quiz</p>

            <div class="menu-options">
                <button class="menu-btn" onclick="startQuiz('full-a')">
                    <div class="menu-btn-title">Full Exam - Version A</div>
                    <div class="menu-btn-desc">50 questions, all categories</div>
                </button>
                <button class="menu-btn" onclick="startQuiz('full-b')">
                    <div class="menu-btn-title">Full Exam - Version B</div>
                    <div class="menu-btn-desc">50 questions, all categories</div>
                </button>
                <button class="menu-btn" onclick="showCategorySelect()">
                    <div class="menu-btn-title">Practice by Category</div>
                    <div class="menu-btn-desc">Choose specific topics to study</div>
                </button>
                <button class="menu-btn" onclick="startQuiz('random')">
                    <div class="menu-btn-title">Random Mix</div>
                    <div class="menu-btn-desc">25 random questions from both versions</div>
                </button>
            </div>
        </div>

        <!-- Category Selection -->
        <div id="category-screen" class="card hidden">
            <h1>Select Categories</h1>
            <p class="subtitle">Choose the topics you want to practice</p>

            <div class="category-select">
                <label class="category-option">
                    <input type="checkbox" value="cardiomyopathy" checked>
                    Cardiomyopathy (22 questions)
                </label>
                <label class="category-option">
                    <input type="checkbox" value="dysrhythmias" checked>
                    Dysrhythmias (30 questions)
                </label>
                <label class="category-option">
                    <input type="checkbox" value="mi" checked>
                    MI/Aneurysms (22 questions)
                </label>
                <label class="category-option">
                    <input type="checkbox" value="teamwork" checked>
                    Teamwork & Delegation (22 questions)
                </label>
                <label class="category-option">
                    <input type="checkbox" value="calculations" checked>
                    Dosage Calculations (4 questions)
                </label>
            </div>

            <div class="btn-container">
                <button class="btn btn-secondary" onclick="showMenu()">Back</button>
                <button class="btn btn-primary" onclick="startCategoryQuiz()">Start Practice</button>
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="card hidden">
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <div class="stats">
                <div class="stat">Question <span class="stat-value" id="current-q">1</span> of <span id="total-q">50</span></div>
                <div class="stat">Correct: <span class="stat-value" id="correct-count">0</span></div>
                <div class="stat">Score: <span class="stat-value" id="current-score">0%</span></div>
            </div>

            <div class="category-badge" id="question-category">Category</div>

            <div class="question-text" id="question-text"></div>

            <div class="select-instruction hidden" id="select-instruction">Select all that apply</div>

            <div class="options" id="options-container"></div>

            <div class="feedback" id="feedback">
                <div class="feedback-title" id="feedback-title"></div>
                <div class="feedback-text" id="feedback-text"></div>
            </div>

            <div class="btn-container">
                <button class="btn btn-secondary" onclick="showMenu()">Exit Quiz</button>
                <button class="btn btn-primary" id="submit-btn" onclick="submitAnswer()" disabled>Submit Answer</button>
                <button class="btn btn-primary hidden" id="next-btn" onclick="nextQuestion()">Next Question</button>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="card results-card hidden">
            <h1>Quiz Complete!</h1>

            <div class="score-circle">
                <div class="score-percent" id="final-score">0%</div>
                <div class="score-label">Final Score</div>
            </div>

            <div class="results-breakdown">
                <div class="breakdown-item">
                    <div class="breakdown-label">Correct</div>
                    <div class="breakdown-value" id="final-correct">0</div>
                </div>
                <div class="breakdown-item">
                    <div class="breakdown-label">Incorrect</div>
                    <div class="breakdown-value" id="final-incorrect">0</div>
                </div>
                <div class="breakdown-item">
                    <div class="breakdown-label">Total Questions</div>
                    <div class="breakdown-value" id="final-total">0</div>
                </div>
            </div>

            <div class="review-list" id="review-list">
                <h3 style="margin-bottom: 15px;">Review Missed Questions:</h3>
            </div>

            <div class="btn-container" style="justify-content: center; margin-top: 30px;">
                <button class="btn btn-secondary" onclick="showMenu()">Back to Menu</button>
                <button class="btn btn-primary" onclick="retryMissed()">Retry Missed Questions</button>
            </div>
        </div>
    </div>

    <script>
        // Question Bank - Version A
        const questionsA = [
            // Cardiomyopathy (1-11)
            {
                id: 'a1',
                category: 'cardiomyopathy',
                text: 'A 45-year-old male is admitted with progressive fatigue and dyspnea. His echocardiogram reveals an ejection fraction of 25% with enlarged, weakened ventricles. Which type of cardiomyopathy does the nurse suspect?',
                options: ['Hypertrophic cardiomyopathy', 'Restrictive cardiomyopathy', 'Dilated cardiomyopathy', 'Arrhythmogenic right ventricular cardiomyopathy'],
                correct: [2],
                rationale: 'Dilated cardiomyopathy is characterized by enlarged, weakened ventricles with a reduced ejection fraction. An EF of 25% (normal is 55-70%) indicates significant systolic dysfunction.'
            },
            {
                id: 'a2',
                category: 'cardiomyopathy',
                text: 'A 19-year-old college athlete collapses during basketball practice. He is successfully resuscitated and later diagnosed with a genetic cardiac condition. The nurse understands that sudden cardiac death in young athletes is most commonly associated with which condition?',
                options: ['Dilated cardiomyopathy', 'Hypertrophic cardiomyopathy', 'Restrictive cardiomyopathy', 'Peripartum cardiomyopathy'],
                correct: [1],
                rationale: 'Hypertrophic cardiomyopathy (HCM) is the leading cause of sudden cardiac death in young athletes. The thickened heart muscle can cause fatal arrhythmias during intense physical exertion.'
            },
            {
                id: 'a3',
                category: 'cardiomyopathy',
                text: 'A patient with hypertrophic cardiomyopathy (HCM) is being discharged. Which statement by the patient indicates a need for further teaching?',
                options: ['"I should avoid strenuous physical activity"', '"I need to take my beta-blocker every day"', '"I can continue my competitive weightlifting routine"', '"I should report any episodes of fainting to my doctor"'],
                correct: [2],
                rationale: 'Patients with HCM should avoid strenuous exercise, especially competitive sports and weightlifting, as these activities increase the risk of sudden cardiac death. This statement indicates the patient needs more education.'
            },
            {
                id: 'a4',
                category: 'cardiomyopathy',
                text: 'A nurse is caring for a patient newly diagnosed with dilated cardiomyopathy. The provider orders digoxin 0.125 mg daily. The nurse should monitor the patient for which hallmark sign of digoxin toxicity?',
                options: ['Tinnitus', 'Visual disturbances with yellow-green halos', 'Severe headache', 'Muscle weakness'],
                correct: [1],
                rationale: 'Visual disturbances, particularly yellow-green halos around lights, are classic signs of digoxin toxicity. Other signs include nausea, vomiting, and bradycardia.'
            },
            {
                id: 'a5',
                category: 'cardiomyopathy',
                text: 'A patient with restrictive cardiomyopathy presents with jugular venous distention and peripheral edema. The nurse recognizes these findings are manifestations of:',
                options: ['Left-sided heart failure', 'Right-sided heart failure', 'Pulmonary embolism', 'Cardiac tamponade'],
                correct: [1],
                rationale: 'JVD and peripheral edema are signs of right-sided heart failure. The stiff ventricle in restrictive cardiomyopathy impairs filling, causing blood to back up into the systemic venous circulation.'
            },
            {
                id: 'a6',
                category: 'cardiomyopathy',
                text: 'The nurse is educating a patient about cardiomyopathy. The patient asks which diagnostic test is most important for diagnosing cardiomyopathy. The nurse correctly responds:',
                options: ['Chest X-ray', 'Electrocardiogram', 'Echocardiogram', 'Cardiac catheterization'],
                correct: [2],
                rationale: 'Echocardiogram is the gold standard for diagnosing cardiomyopathy. It provides visualization of heart structure, wall thickness, chamber size, valve function, and ejection fraction.'
            },
            {
                id: 'a7',
                category: 'cardiomyopathy',
                text: 'A patient with advanced dilated cardiomyopathy is experiencing fluid overload. Which nursing intervention is the priority?',
                options: ['Provide a low-sodium diet', 'Administer prescribed diuretics', 'Encourage increased fluid intake', 'Position the patient flat in bed'],
                correct: [1],
                rationale: 'Administering prescribed diuretics is the priority intervention for acute fluid overload to quickly reduce fluid volume. Diet modification is important but not the immediate priority.'
            },
            {
                id: 'a8',
                category: 'cardiomyopathy',
                text: 'A nurse is assessing a patient admitted with cardiomyopathy. Which two symptoms are often tested on NCLEX as being the earliest signs of hypoxia? (Select two)',
                options: ['Cyanosis', 'Restlessness', 'Bradycardia', 'Agitation', 'Hypotension'],
                correct: [1, 3],
                multiSelect: true,
                rationale: 'Restlessness and agitation are early signs of hypoxia as the brain responds to decreased oxygen levels. Cyanosis is a late sign of hypoxia.'
            },
            {
                id: 'a9',
                category: 'cardiomyopathy',
                text: 'A patient with dilated cardiomyopathy asks why their cardiac output is low. The nurse explains that cardiac output equals heart rate multiplied by:',
                options: ['Blood pressure', 'Stroke volume', 'Ejection fraction', 'Afterload'],
                correct: [1],
                rationale: 'Cardiac Output = Heart Rate × Stroke Volume. In dilated cardiomyopathy, the weakened ventricle has reduced stroke volume, leading to decreased cardiac output.'
            },
            {
                id: 'a10',
                category: 'cardiomyopathy',
                text: 'A woman who gave birth 6 weeks ago presents with severe fatigue and shortness of breath. Her echocardiogram shows decreased ejection fraction. The nurse suspects:',
                options: ['Hypertrophic cardiomyopathy', 'Peripartum cardiomyopathy', 'Restrictive cardiomyopathy', 'Amyloid cardiomyopathy'],
                correct: [1],
                rationale: 'Peripartum cardiomyopathy develops during the last month of pregnancy or within 5 months after delivery in women with no prior heart disease. The timing (6 weeks postpartum) and symptoms are classic.'
            },
            {
                id: 'a11',
                category: 'cardiomyopathy',
                text: 'A patient with cardiomyopathy is prescribed metoprolol. The nurse understands this beta-blocker works by:',
                options: ['Increasing contractility of the heart', 'Reducing the workload of the heart', 'Dissolving blood clots', 'Increasing heart rate'],
                correct: [1],
                rationale: 'Beta-blockers like metoprolol reduce the workload of the heart by decreasing heart rate and blood pressure, which helps manage heart failure and reduces oxygen demand.'
            },
            // Dysrhythmias (12-26)
            {
                id: 'a12',
                category: 'dysrhythmias',
                text: 'A patient on telemetry suddenly develops a wide QRS complex regular rhythm at 180 bpm. The patient is unresponsive and pulseless. What is the nurse\'s immediate priority action?',
                options: ['Administer amiodarone 300 mg IV push', 'Begin CPR and prepare for defibrillation', 'Administer atropine 1 mg IV push', 'Obtain a 12-lead ECG'],
                correct: [1],
                rationale: 'A pulseless patient with ventricular tachycardia requires immediate CPR and defibrillation. This is a cardiac arrest situation requiring immediate ACLS intervention.'
            },
            {
                id: 'a13',
                category: 'dysrhythmias',
                text: 'A patient is found unresponsive with an organized rhythm on the monitor at 90 bpm, but no palpable pulse. The nurse recognizes this as:',
                options: ['Ventricular fibrillation', 'Asystole', 'Pulseless electrical activity (PEA)', 'Ventricular tachycardia'],
                correct: [2],
                rationale: 'Pulseless electrical activity (PEA) is characterized by organized electrical activity on the monitor but no detectable pulse. Treatment focuses on identifying and treating reversible causes (Hs and Ts).'
            },
            {
                id: 'a14',
                category: 'dysrhythmias',
                text: 'The nurse understands that defibrillation is NOT indicated for which rhythm?',
                options: ['Ventricular fibrillation', 'Pulseless ventricular tachycardia', 'Asystole', 'Torsades de Pointes'],
                correct: [2],
                rationale: 'Defibrillation is not indicated for asystole (flatline) because there is no electrical activity to reset. Defibrillation is indicated for shockable rhythms: VF, pulseless VT, and Torsades de Pointes.'
            },
            {
                id: 'a15',
                category: 'dysrhythmias',
                text: 'A 75-year-old patient presents with palpitations and shortness of breath. Telemetry shows an irregularly irregular rhythm with no visible P waves and a heart rate varying between 110-140 bpm. This rhythm is:',
                options: ['Atrial flutter', 'Atrial fibrillation', 'Sinus tachycardia', 'Supraventricular tachycardia'],
                correct: [1],
                rationale: 'Atrial fibrillation is characterized by an irregularly irregular rhythm with no discernible P waves. The variable ventricular rate (110-140) is typical of uncontrolled AFib.'
            },
            {
                id: 'a16',
                category: 'dysrhythmias',
                text: 'A patient with atrial fibrillation is at risk for which major complication?',
                options: ['Ventricular hypertrophy', 'Stroke', 'Pneumonia', 'Renal failure'],
                correct: [1],
                rationale: 'Atrial fibrillation increases stroke risk significantly because blood can pool in the fibrillating atria, forming clots that can travel to the brain. This is why anticoagulation is crucial.'
            },
            {
                id: 'a17',
                category: 'dysrhythmias',
                text: 'A patient with a history of alcoholism is admitted with a prolonged QT interval. The patient suddenly becomes unresponsive and the monitor shows a twisting pattern of ventricular tachycardia. After epinephrine and amiodarone, which medication would the nurse anticipate administering?',
                options: ['Adenosine', 'Atropine', 'Magnesium sulfate', 'Lidocaine'],
                correct: [2],
                rationale: 'Torsades de Pointes (twisting VT pattern with prolonged QT) is treated with magnesium sulfate. Alcoholism often leads to hypomagnesemia, which can precipitate Torsades.'
            },
            {
                id: 'a18',
                category: 'dysrhythmias',
                text: 'A 68-year-old patient on metoprolol presents with dizziness and fatigue. Heart rate is 46 bpm, BP 92/60. Telemetry shows a regular rhythm with P waves before each QRS. If the patient is symptomatic, what medication would the nurse anticipate?',
                options: ['Adenosine', 'Atropine', 'Amiodarone', 'Diltiazem'],
                correct: [1],
                rationale: 'Atropine is the first-line medication for symptomatic bradycardia. It blocks vagal stimulation to increase heart rate. The patient\'s symptoms (dizziness, fatigue, low BP) indicate they are symptomatic.'
            },
            {
                id: 'a19',
                category: 'dysrhythmias',
                text: 'A nurse observes a chaotic, irregular waveform with no consistent QRS complexes on the monitor. The patient is unresponsive. This rhythm is:',
                options: ['Asystole', 'Ventricular fibrillation', 'Atrial fibrillation with RVR', 'Third-degree heart block'],
                correct: [1],
                rationale: 'Ventricular fibrillation appears as a chaotic, irregular waveform with no identifiable QRS complexes. It is a lethal rhythm requiring immediate defibrillation.'
            },
            {
                id: 'a20',
                category: 'dysrhythmias',
                text: 'A post-MI patient shows progressively lengthening PR intervals followed by a dropped QRS complex. The nurse identifies this as:',
                options: ['First-degree AV block', 'Second-degree AV block Type I (Wenckebach)', 'Second-degree AV block Type II', 'Third-degree AV block'],
                correct: [1],
                rationale: 'Second-degree AV block Type I (Wenckebach) is characterized by progressively lengthening PR intervals until a QRS is dropped. It\'s often seen after inferior MI and is usually benign.'
            },
            {
                id: 'a21',
                category: 'dysrhythmias',
                text: 'A patient has intermittent dropped QRS complexes with constant PR intervals and a heart rate of 38 bpm. The patient is pale and diaphoretic. Why is atropine often ineffective for this rhythm?',
                options: ['The block is located at the SA node', 'The block is located below the AV node', 'Atropine causes vasoconstriction', 'The patient has atrial fibrillation'],
                correct: [1],
                rationale: 'Second-degree AV block Type II occurs below the AV node (infranodal). Atropine works on the AV node, so it\'s often ineffective. These patients typically need pacing.'
            },
            {
                id: 'a22',
                category: 'dysrhythmias',
                text: 'A 32-year-old patient with sepsis has a heart rate of 132 bpm. Telemetry shows a regular rhythm with normal P waves. The nurse should:',
                options: ['Administer adenosine', 'Prepare for immediate cardioversion', 'Treat the underlying cause', 'Administer amiodarone'],
                correct: [2],
                rationale: 'This is sinus tachycardia secondary to sepsis. Sinus tachycardia is a compensatory response and should be treated by addressing the underlying cause (sepsis), not by treating the rhythm itself.'
            },
            {
                id: 'a23',
                category: 'dysrhythmias',
                text: 'A patient suddenly develops a narrow QRS complex tachycardia at 200 bpm with sudden onset. The patient reports palpitations and dizziness but is hemodynamically stable. The nurse anticipates the provider will first order:',

                correct: [1],
                rationale: 'Maslow\'s hierarchy helps prioritize: physiological needs (airway, breathing, circulation) first, then safety, belonging, esteem, and self-actualization. Address survival needs before psychological needs.'
            },
            // Calculations (49-50)
            {
                id: 'b49',
                category: 'calculations',
                text: 'A patient weighing 70 kg is prescribed dopamine at 5 mcg/kg/min. The pharmacy provides dopamine 400 mg in 250 mL D5W. Calculate the infusion rate in mL/hr.',
                options: ['10.5 mL/hr', '13.1 mL/hr', '15.0 mL/hr', '17.5 mL/hr'],
                correct: [1],

            {
                id: 'b50',
                category: 'calculations',
                text: 'A patient is ordered amiodarone 150 mg IV over 10 minutes. The pharmacy sends amiodarone 150 mg in 100 mL D5W. At what rate should the nurse program the IV pump?',
                options: ['100 mL/hr', '300 mL/hr', '600 mL/hr', '900 mL/hr'],
                correct: [2],
                rationale: 'Calculation: Need to infuse 100 mL over 10 minutes. Convert to mL/hr: 100 mL × (60 min/10 min) = 100 × 6 = 600 mL/hr'
            }
        ];

        // Category mappings
        const categoryNames = {
            cardiomyopathy: 'Structural/Cardiomyopathy',
            dysrhythmias: 'Dysrhythmias',
            mi: 'MI/Aneurysms',
            teamwork: 'Teamwork & Delegation',
            calculations: 'Dosage Calculations'
        };

        // Quiz state
        let currentQuestions = [];
        let currentIndex = 0;
        let correctCount = 0;
        let selectedAnswers = [];
        let answeredQuestions = [];
        let missedQuestions = [];

        // DOM elements
        const screens = {
            menu: document.getElementById('menu-screen'),
            category: document.getElementById('category-screen'),
            quiz: document.getElementById('quiz-screen'),
            results: document.getElementById('results-screen')
        };

        function showScreen(screenName) {
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            screens[screenName].classList.remove('hidden');
        }

        function showMenu() {
            showScreen('menu');
        }

        function showCategorySelect() {
            showScreen('category');
            // Reset checkboxes
            document.querySelectorAll('.category-option input').forEach(cb => cb.checked = true);
        }

        function startQuiz(mode) {
            currentQuestions = [];
            currentIndex = 0;
            correctCount = 0;
            answeredQuestions = [];
            missedQuestions = [];

            if (mode === 'full-a') {
                currentQuestions = [...questionsA];
            } else if (mode === 'full-b') {
                currentQuestions = [...questionsB];
            } else if (mode === 'random') {
                const allQuestions = [...questionsA, ...questionsB];
                shuffleArray(allQuestions);
                currentQuestions = allQuestions.slice(0, 25);
            }

            showScreen('quiz');
            displayQuestion();
        }

        function startCategoryQuiz() {
            const selectedCategories = Array.from(document.querySelectorAll('.category-option input:checked'))
                .map(cb => cb.value);

            if (selectedCategories.length === 0) {
                alert('Please select at least one category');
                return;
            }

            currentQuestions = [];
            currentIndex = 0;
            correctCount = 0;
            answeredQuestions = [];
            missedQuestions = [];

            const allQuestions = [...questionsA, ...questionsB];
            currentQuestions = allQuestions.filter(q => selectedCategories.includes(q.category));
            shuffleArray(currentQuestions);

            showScreen('quiz');
            displayQuestion();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function displayQuestion() {
            const question = currentQuestions[currentIndex];
            selectedAnswers = [];

            // Update progress
            const progress = ((currentIndex) / currentQuestions.length) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';
            document.getElementById('current-q').textContent = currentIndex + 1;
            document.getElementById('total-q').textContent = currentQuestions.length;
            document.getElementById('correct-count').textContent = correctCount;
            const scorePercent = currentIndex > 0 ? Math.round((correctCount / currentIndex) * 100) : 0;
            document.getElementById('current-score').textContent = scorePercent + '%';

            // Display category and question
            document.getElementById('question-category').textContent = categoryNames[question.category];
            document.getElementById('question-text').textContent = question.text;

            // Show select instruction if multi-select
            const instruction = document.getElementById('select-instruction');
            if (question.multiSelect) {
                instruction.classList.remove('hidden');
            } else {
                instruction.classList.add('hidden');
            }

            // Display options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const letters = ['A', 'B', 'C', 'D', 'E'];
            question.options.forEach((option, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                optionDiv.innerHTML = `
                    <span class="option-letter">${letters[index]}.</span>
                    <span class="option-text">${option}</span>
                `;
                optionDiv.onclick = () => selectOption(index, question.multiSelect);
                optionsContainer.appendChild(optionDiv);
            });

            // Reset buttons and feedback
            document.getElementById('submit-btn').classList.remove('hidden');
            document.getElementById('submit-btn').disabled = true;
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('feedback').style.display = 'none';
        }

        function selectOption(index, multiSelect) {
            const options = document.querySelectorAll('.option');

            if (options[0].classList.contains('disabled')) return;

            if (multiSelect) {
                const pos = selectedAnswers.indexOf(index);
                if (pos > -1) {
                    selectedAnswers.splice(pos, 1);
                    options[index].classList.remove('selected');
                } else {
                    selectedAnswers.push(index);
                    options[index].classList.add('selected');
                }
            } else {
                selectedAnswers = [index];
                options.forEach((opt, i) => {
                    opt.classList.toggle('selected', i === index);
                });
            }

            document.getElementById('submit-btn').disabled = selectedAnswers.length === 0;
        }

        function submitAnswer() {
            const question = currentQuestions[currentIndex];
            const options = document.querySelectorAll('.option');

            // Disable further selection
            options.forEach(opt => opt.classList.add('disabled'));

            // Check answer
            const sortedSelected = [...selectedAnswers].sort();
            const sortedCorrect = [...question.correct].sort();
            const isCorrect = JSON.stringify(sortedSelected) === JSON.stringify(sortedCorrect);

            if (isCorrect) {
                correctCount++;
                selectedAnswers.forEach(i => options[i].classList.add('correct'));
            } else {
                selectedAnswers.forEach(i => {
                    if (!question.correct.includes(i)) {
                        options[i].classList.add('incorrect');
                    }
                });
                question.correct.forEach(i => options[i].classList.add('correct'));
                missedQuestions.push({
                    question: question,
                    userAnswer: selectedAnswers,
                    correctAnswer: question.correct
                });
            }

            // Show feedback
            const feedback = document.getElementById('feedback');
            feedback.style.display = 'block';
            feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
            document.getElementById('feedback-title').textContent = isCorrect ? 'Correct!' : 'Incorrect';
            document.getElementById('feedback-text').textContent = question.rationale;

            // Update buttons
            document.getElementById('submit-btn').classList.add('hidden');
            document.getElementById('next-btn').classList.remove('hidden');
            document.getElementById('next-btn').textContent =
                currentIndex < currentQuestions.length - 1 ? 'Next Question' : 'View Results';

            // Update score display
            document.getElementById('correct-count').textContent = correctCount;
            const scorePercent = Math.round((correctCount / (currentIndex + 1)) * 100);
            document.getElementById('current-score').textContent = scorePercent + '%';

            // Record answer
            answeredQuestions.push({
                question: question,
                correct: isCorrect
            });
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                displayQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            showScreen('results');

            const total = currentQuestions.length;
            const incorrect = total - correctCount;
            const percent = Math.round((correctCount / total) * 100);

            document.getElementById('final-score').textContent = percent + '%';
            document.getElementById('final-correct').textContent = correctCount;
            document.getElementById('final-incorrect').textContent = incorrect;
            document.getElementById('final-total').textContent = total;

            // Show missed questions
            const reviewList = document.getElementById('review-list');
            reviewList.innerHTML = '<h3 style="margin-bottom: 15px;">Review Missed Questions:</h3>';

            if (missedQuestions.length === 0) {
                reviewList.innerHTML += '<p style="color: #28a745; font-weight: 500;">Perfect score! No questions to review.</p>';
                document.querySelector('button[onclick="retryMissed()"]').style.display = 'none';
            } else {
                document.querySelector('button[onclick="retryMissed()"]').style.display = 'inline-block';
                const letters = ['A', 'B', 'C', 'D', 'E'];
                missedQuestions.forEach((item, i) => {
                    const userAnswerText = item.userAnswer.map(idx => letters[idx]).join(', ');
                    const correctAnswerText = item.correctAnswer.map(idx => letters[idx]).join(', ');

                    const div = document.createElement('div');
                    div.className = 'review-item incorrect';
                    div.innerHTML = `
                        <div class="review-question">${i + 1}. ${item.question.text.substring(0, 100)}...</div>
                        <div class="review-answer">Your answer: ${userAnswerText} | Correct: ${correctAnswerText}</div>
                    `;
                    reviewList.appendChild(div);
                });
            }
        }

        function retryMissed() {
            if (missedQuestions.length === 0) return;

            currentQuestions = missedQuestions.map(m => m.question);
            currentIndex = 0;
            correctCount = 0;
            answeredQuestions = [];
            missedQuestions = [];

            showScreen('quiz');
            displayQuestion();
        }

        // Category option styling
        document.querySelectorAll('.category-option').forEach(label => {
            const checkbox = label.querySelector('input');
            checkbox.addEventListener('change', () => {
                label.classList.toggle('selected', checkbox.checked);
            });
            label.classList.toggle('selected', checkbox.checked);
        });
    </script>
